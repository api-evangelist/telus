description: >-
  Versioning, deprecation, retention and availability posture across the two publicly documented
  TELUS APIs. The two surfaces are at opposite ends of the maturity curve: the CHR Enterprise API
  runs a bi-weekly release train with a dated public changelog and an announce-then-replace
  deprecation habit, while the Insights Location API has a URI version segment and nothing else.

