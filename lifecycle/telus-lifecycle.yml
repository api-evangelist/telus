- api: TELUS Health CHR Enterprise API
  versioning:
    scheme: release-train
    version_format: YY.WW
    current: '26.13'
    cadence: bi-weekly, plus off-schedule releases for out-of-band fixes
    docs: https://help.inputhealth.com/en/collections/3317215-chr-enterprise-api
  deprecation:
    policy_url: null
    policy_published: false
    announcements_url: https://help.inputhealth.com/en/articles/13391004-what-s-new-in-the-api-2026
    practice: >-
      Deprecations, replacements and removals are announced per version in the dated public
      changelog. Observed pattern: a field is deprecated with a named replacement (middleInitial ->
      middleName, 23.14) or removed with a stated reason (createAppointmentOptions "removed as the
      functionality has been replaced", 23.24; consentToDeferredPrescription "removed as it is for
      internal CHR use only", 23.12). No machine-readable Deprecation/Sunset headers and no fixed
      notice period are published.
    sunset_header: false
    deprecation_header: false
    schema_deprecation_markers: true
    schema_deprecation_note: >-
      The published GraphQL introspection document carries the standard isDeprecated /
      deprecationReason markers on fields and enum values, so deprecations are machine-readable in
      graphql/telus-chr-enterprise-api.graphql (rendered as @deprecated directives).
  data_lifecycle:
    api_log_retention_days: 90
    api_log_statement: All API actions are recorded; requests and responses are retained for 90 days.
    api_log_viewer: https://help.inputhealth.com/en/articles/6483231-viewing-api-logs
  sla:
    url: null
    uptime_target: null
    published: false
  status_page: null
