description: >-
  Two unrelated domain models. The CHR Enterprise API is a full ambulatory-care graph — patients,
  appointments, encounters, referrals, cases, tasks — with Relay connections between entities. The
  Insights Location API is a tiny model: a shapefile becomes study zones, a study zone becomes a
  count job, a job produces buckets. Every entity and every relationship below was read out of a
  published artifact; nothing is inferred beyond the field names those artifacts contain.

