- domain: TELUS Insights Location API
  source: collections/telus-insights-location-api.postman_collection.json
  identifier_style: UUIDs generated by the platform (requestId, jobId, customerId)
  entities:
  - entity: Customer
    key: customer_id
    key_format: UUID
    description: >-
      "The unique ID generated when 'Create Customer ID' is performed which creates the association
      of a customer with their unique API key." Sent as the customerId header on every request.
    relationships:
    - {type: has_many, target: Shapefile, via: customerId}
    - {type: has_many, target: Job, via: customerId}
  - entity: Shapefile
    key: request_id
    key_format: UUID
    created_by: POST /shapefile
    read_by: ['GET /shapefile', 'GET /shapefile/{requestId}', 'GET /geofence']
    deleted_by: DELETE /shapefile/{requestId}
    formats: ['.kml (Google Keyhole Markup)', '.zip (ESRI: .dbf/.prj/.shp/.shx/.cpg)', '.json (GeoJSON)']
    constraints: {max_file_size_mb: 25, max_study_zones: 2000, max_row_size_mb: 4, file_name_max_chars: 75}
    relationships:
    - {type: has_many, target: StudyZone, via: study_zone column}
  - entity: StudyZone
    key: study_zone
    key_format: string, unique per shapefile, <= 50 characters, no backslashes or quotation marks
    aliases: [geoid (on GET responses), polygon, geofence]
    description: A named geospatial boundary; the unit every count job is computed over.
    relationships:
    - {type: belongs_to, target: Shapefile, via: requestId}
  - entity: GeoId
    description: >-
      The composite selector a job is run against — a requestId plus one or more study_zone names,
      optionally with its own min_dwell_time / max_dwell_time.
    roles: [input_geoid, output_geoid, pass_through_geoid]
    relationships:
    - {type: belongs_to, target: Shapefile, via: requestId}
    - {type: has_many, target: StudyZone, via: study_zone}
  - entity: Job
    key: job_id
    key_format: UUID
    created_by: POST /count/{type}
    read_by: ['GET /count/{type}/{jobId}', 'GET /job']
    cancelled_by: PATCH /job/{jobid}/cancel
    deleted_by: DELETE /job/{jobid}
    states: [Processing, COMPLETE]
    types: [demographic, unique, origin, destination, odmatrix, dwelltime, totaltrip, repeatvisitation, tradearea, home, work]
    relationships:
    - {type: belongs_to, target: GeoId, via: input_geoid}
    - {type: belongs_to, target: GeoId, via: output_geoid}
    - {type: belongs_to, target: GeoId, via: pass_through_geoid}
    - {type: has_many, target: ResultBucket, via: buckets}
  - entity: ResultBucket
    description: >-
      A time (and, for dwell-time jobs, dwell) slice of a completed job result — the leaf of the
      model. Returned under study_zones[].buckets[] with the aggregated, extrapolated, rounded count.
    fields: [bucket, bucket_size, start_time, end_time, geoid]
    privacy_floor: minimum 20 devices post-extrapolation; counts rounded up to the nearest 10
  - entity: Usage
    read_by: GET /usage
    scope: organization
    metrics: [monthly API calls, study zones queried, per-endpoint breakdown, year-over-year comparison]

