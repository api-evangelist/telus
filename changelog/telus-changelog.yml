description: >-
  TELUS keeps a genuine, dated, per-version API changelog — but only for the TELUS Health CHR
  Enterprise API, published as one "What's new in the API" article per calendar year in the CHR help
  centre. The Insights Location API has no changelog of any kind. The CHR changelog is the single
  best evidence that TELUS runs at least one API as a versioned product rather than a project.

