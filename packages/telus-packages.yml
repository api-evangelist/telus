generated: '2026-07-25'
method: searched
source: >-
  npm registry search across the @telus, @telus-uds, @telusdigital and @telus-health-chr scopes on
  2026-07-25; PyPI, Maven Central, NuGet, RubyGems, pkg.go.dev, Packagist and crates.io checked for
  TELUS API client libraries.
description: >-
  TELUS publishes real, actively maintained first-party npm packages — but none of them is an API
  client. Everything under the @telus-uds scope is the Universal Design System (palettes, themes and
  React/React-Native component libraries for TELUS, Koodo and Public Mobile), and everything under
  the older @telus scope is internal engineering tooling. Neither publicly documented TELUS API has
  a client SDK in any language: the Insights Location API ships shell/curl snippets only, and the
  CHR Enterprise API expects the consumer to use any standard GraphQL client. That absence is the
  finding, not an omission.

api_client_sdks:
  count: 0
  note: >-
    No first-party client library exists on npm, PyPI, Maven Central, NuGet, RubyGems, pkg.go.dev,
    Packagist or crates.io for the TELUS Insights Location API or the TELUS Health CHR Enterprise
    API. No `SDKs` pointer is wired in apis.yml, because wiring one would misrepresent a design
    system as an API client.

