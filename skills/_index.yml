cross_cutting_rules:
- No idempotency key exists on either API — never blind-retry a write.
- Insights tokens live 299 seconds and must be reused; CHR JWTs must expire within 900 seconds and are self-signed.
- Insights requires both an OAuth bearer token and a customerId header on every call.
- CHR returns field errors in the GraphQL errors array with HTTP 200 — inspect errors, not just status.
- Honour the Insights usage guidance (10 queries/hour, 100/day, 5 concurrent) — it is unenforced but real.
