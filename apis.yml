- aid: telus:telus-health-chr-enterprise-api
  name: TELUS Health CHR Enterprise API
  description: >-
    The TELUS Health Collaborative Health Record (CHR) Enterprise API is a GraphQL interface onto the
    CHR ambulatory-care platform used by Canadian clinics and allied health professionals. Its published
    introspection document describes 505 types, 64 root queries and 49 mutations spanning patients,
    appointments and availability, encounters, referrals, cases, tasks, group visits, attachments,
    letters, lab results (including OLIS lab messages), allergy and medication records, health profiles,
    facilities, providers and work hours. Pagination follows the GraphQL Cursor Connections
    specification (default 50, maximum 100 records per page). Authentication is unusual and notably
    strong: the consumer generates a 2048-bit RSA key pair, registers the public key on an API Consumer
    inside the CHR account, and signs its own RS512 JWT that must carry a matching iss claim and expire
    within 900 seconds — there is no authorization server, no token endpoint and no client secret. A
    companion Event Notification Service pushes 21 signed webhook topics carrying identifiers only, with
    no personal or personal-health information in the payload. Every API action is audit-logged for 90
    days. The API ships on a bi-weekly release train with a dated public changelog going back to 2022,
    but it is a paid feature available to select customers, and the executable endpoint is issued per
    clinic account rather than published.
  humanURL: https://help.inputhealth.com/en/collections/3317215-chr-enterprise-api
  baseURL: https://apidocs.ca.inputhealth.com/enterprise-api
  baseURLNote: >-
    The live GraphQL endpoint is issued per CHR account domain and is read from Settings > Enterprise
    API inside the account; TELUS does not publish it. The URL recorded here is the public,
    anonymously reachable schema surface for the same API — the GraphQL Voyager explorer, whose
    introspection document at /enterprise-api/introspection.json was harvested verbatim into graphql/.
  tags:
