apis:
- aid: telus:telus-insights-location-api
  name: TELUS Insights Location API
  description: >-
    The TELUS Insights Location API exposes de-identified, aggregated geo-intelligence derived from the
    TELUS mobile network across Canada. Consumers submit asynchronous count jobs — demographic, origin,
    destination, origin-destination matrix, dwell time, trade area, repeat visitation, total trip, unique
    devices, home and work — against uploaded shapefile study zones or built-in geofences, then poll a
    job identifier for results. Documentation is published publicly through Postman; the gateway at
    location-api.insights.telus.com is live and returns 401 without a bearer token. Access uses OAuth2
    client credentials issued through the TELUS Insights Portal after a sales-led onboarding, so the
    API is documented publicly but is not self-serve.
  humanURL: https://docs.insights.telus.com/
  baseURL: https://location-api.insights.telus.com/product/insightsRequest/v1
