name: TELUS
kind: company
description: >-
  TELUS Corporation is one of Canada's three national facilities-based telecommunications carriers,
  operating a nationwide mobile network alongside broadband, TV, security, health (TELUS Health) and
  agriculture (TELUS Agriculture & Consumer Goods) businesses from its Vancouver headquarters. In the
  API value chain TELUS is a network owner rather than a developer-facing platform: its API Marketplace
  at api.telus.com sits behind the TELUS Client Identity login, its developers.telus.com "Simplify"
  portal is an internal/partner surface that refuses anonymous requests, and its IoT Marketplace is a
  login wall. The one genuinely public developer surface is the TELUS Insights Location API, a
  geo-intelligence product documented openly on Postman with a live OAuth2-protected gateway, though
  credentials are issued only through a sales onboarding process. TELUS is a named participant in the
  CAMARA project and appears in the CAMARA landscape as an operator, but it publishes no first-party
  CAMARA endpoint — its Number Verification and SIM Swap network APIs reach developers indirectly
  through EnStream LP, the Bell/Rogers/TELUS identity joint venture, which feeds Aduna and from there
  CPaaS channels such as Vonage. TELUS is partner-gated and, for network APIs, reachable only through
  aggregators.
