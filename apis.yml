name: TELUS
kind: company
description: >-
  TELUS Corporation is one of Canada's three national facilities-based telecommunications carriers,
  operating a nationwide mobile network alongside broadband, TV, security, health (TELUS Health) and
  agriculture (TELUS Agriculture & Consumer Goods) businesses from its Vancouver headquarters. In the
  API value chain TELUS is a network owner rather than a developer-facing platform: its API Marketplace
  at api.telus.com sits behind the TELUS Client Identity login, its developers.telus.com "Simplify"
  portal is an internal/partner surface that refuses anonymous requests, and its IoT Marketplace is a
  login wall. Two TELUS APIs are nonetheless documented in the open, and neither is on a telus.com
  property. The TELUS Insights Location API publishes a 27-operation reference through Postman
  Documenter and runs a live OAuth2-protected gateway. The TELUS Health Collaborative Health Record
  (CHR) Enterprise API is a substantial GraphQL platform — 505 types, 64 queries, 49 mutations and a
  21-topic signed webhook service — whose full introspection document is anonymously fetchable from
  apidocs.ca.inputhealth.com, making it the only machine-readable API contract TELUS publishes
  anywhere. Both are gated commercially: Insights credentials come from a sales-led ticket in the
  Insights Portal, and CHR Enterprise API access is a paid feature enabled per clinic account after a
  contract and a privacy questionnaire. TELUS is a named participant in the CAMARA project and appears
  in the CAMARA landscape as an operator, but it publishes no first-party CAMARA endpoint — its Number
  Verification and SIM Swap network APIs reach developers indirectly through EnStream LP, the
  Bell/Rogers/TELUS identity joint venture, which feeds Aduna and from there CPaaS channels such as
  Vonage. TELUS is partner-gated and, for network APIs, reachable only through aggregators.
